<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mackenzie & Sam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
      /* Register Local Fonts */
      @font-face {
        font-family: 'Amsterdam Four';
        src: url('fonts/amsterdam-four.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      
      @font-face {
        font-family: 'Garet';
        src: url('fonts/garet/Garet-Book.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }

      body {
        background-color: #F2F0E9;
        overflow-x: hidden;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'wedding-cream': '#F2F0E9',
              'wedding-green': '#556B2F',
              'wedding-brown': '#5D4037',
              'wedding-paper': '#FDFBF7',
            },
            fontFamily: {
              // 'Amsterdam Four' is the script font used for main headers
              script: ['"Amsterdam Four"', '"Pinyon Script"', 'cursive'],
              // 'Garet' is the geometric sans-serif used for body text
              sans: ['"Garet"', '"Montserrat"', 'sans-serif'],
              // 'Playfair Display' remains for standard serif usage (like on the invite card)
              serif: ['"Playfair Display"', 'serif'],
            }
          }
        }
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
